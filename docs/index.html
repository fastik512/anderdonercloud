<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ander Doner</title>
<style>
:root{--bg:#f4efe2;--surf:#fffdf6;--ink:#14231a;--mute:#56655a;--bd:#14231a;--sh:#14231a;--green:#1f6b3f;--on-green:#fff;--saf:#ffb703;--on-saf:#14231a;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1812;--surf:#17231b;--ink:#f3ecd9;--mute:#9db0a2;--bd:#3d5545;--sh:#000;--green:#58c27f;--on-green:#08140c;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--bd)}
.bar{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.03em;text-transform:uppercase}.logo b{background:var(--saf);color:var(--on-saf);padding:0 7px;margin-left:5px;border-radius:6px}
nav{display:flex;gap:26px;font-size:14px;font-weight:600}
nav a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.btn,.cartbtn,.pri,.more,.tab,.round{font:700 14px system-ui;cursor:pointer;border:2px solid var(--bd);transition:transform .12s,box-shadow .12s}
.cartbtn{background:var(--green);color:var(--on-green);border-radius:10px;padding:9px 16px;box-shadow:3px 3px 0 var(--sh)}
.cartbtn:active,.btn:active,.pri:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.bump{animation:bump .4s}@keyframes bump{40%{transform:perspective(400px) rotateX(-25deg) scale(1.08)}}
.hero{padding-block:56px 40px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.tag{display:inline-block;background:var(--saf);color:var(--on-saf);font:800 12px system-ui;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border:2px solid var(--bd);border-radius:8px;margin-bottom:18px}
h1{font-size:clamp(40px,7.4vw,84px);line-height:.98;letter-spacing:-.045em;margin:0 0 20px;font-weight:900}
.lead{color:var(--mute);max-width:44ch;font-size:18px;margin:0 0 28px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:14px 26px;border-radius:12px;box-shadow:4px 4px 0 var(--saf)}
/* 3D döner */
.stage{perspective:1000px;height:440px;display:grid;place-items:center;position:relative}
.spit{position:relative;width:240px;height:380px;transform-style:preserve-3d;transform:rotateX(calc(-14deg + var(--rx,0deg))) rotateY(var(--ry,0deg));transition:transform .25s ease-out;animation:bob 5s ease-in-out infinite}
.turn{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 10s linear infinite}
.turn i{position:absolute;left:50%;top:var(--y);width:var(--w);height:var(--w);margin:calc(var(--w)/-2) 0 0 calc(var(--w)/-2);border-radius:50%;transform:rotateX(90deg);
background:conic-gradient(from var(--a),#6e3213,#b8632b 16%,#8a4320 30%,#cf8040 50%,#6a2f12 68%,#a85a27 84%,#6e3213);box-shadow:inset 0 0 14px rgba(0,0,0,.4)}
.rod{position:absolute;left:50%;top:-6px;width:8px;height:410px;margin-left:-4px;background:linear-gradient(90deg,#8a8f95,#f1f3f5,#8a8f95);border-radius:4px}
.rod.b{transform:rotateY(90deg)}
.floor{position:absolute;bottom:22px;width:300px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.35),transparent);transform:rotateX(75deg)}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes bob{50%{translate:0 -10px}}
section{padding:52px 0;border-top:2px solid var(--bd)}
h2{font-size:clamp(28px,4vw,42px);letter-spacing:-.035em;margin:0 0 22px;font-weight:900;text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{background:var(--surf);color:var(--ink);padding:8px 16px;border-radius:10px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--saf)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;perspective:1200px}
.card{position:relative;background:var(--surf);border:2px solid var(--bd);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:5px 5px 0 var(--sh);transform-style:preserve-3d;transition:transform .15s ease-out}
.card .em{font-size:54px;line-height:1;transform:translateZ(48px);filter:drop-shadow(6px 10px 6px rgba(0,0,0,.25));width:max-content}
.card h3{margin:6px 0 0;font-size:18px;letter-spacing:-.02em;transform:translateZ(22px)}
.card p{margin:0;color:var(--mute);font-size:14px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;transform:translateZ(26px)}
.price{font-weight:900;font-size:18px}
.round{width:38px;height:38px;border-radius:10px;background:var(--saf);color:var(--on-saf);font-size:22px;line-height:1;box-shadow:2px 2px 0 var(--sh)}
.r3{opacity:0}
.r3.in{opacity:1;animation:rin .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rin{from{opacity:0;transform:perspective(900px) rotateX(24deg) translateY(36px)}}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;perspective:1200px}
.why-i{background:var(--surf);border:2px solid var(--bd);border-radius:16px;padding:20px;box-shadow:5px 5px 0 var(--sh);transform-style:preserve-3d}
.why-i .num{font-size:48px;font-weight:900;color:var(--green);letter-spacing:-.04em;line-height:1;transform:translateZ(36px)}
.why-i h3{margin:8px 0 4px;transform:translateZ(18px)}.why-i p{margin:0;color:var(--mute);font-size:14px}
.addr{list-style:none;margin:0;padding:0;border:2px solid var(--bd);border-radius:16px;background:var(--surf);box-shadow:5px 5px 0 var(--sh);overflow:hidden}
.addr li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 18px;border-bottom:2px solid var(--bd)}.addr li:last-child{border:0}
.addr .h{color:var(--mute);font-weight:600;white-space:nowrap}
footer{border-top:2px solid var(--bd);padding:30px 0 90px;color:var(--mute);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center}
.adm{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit}
/* reviews */
.rv{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
.rvlist{max-height:480px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:2px 6px 6px 2px}
.rvi{background:var(--surf);border:2px solid var(--bd);border-radius:14px;padding:14px 16px;font-size:15px;box-shadow:3px 3px 0 var(--sh)}
.rvi .meta{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:13px;margin-bottom:4px}
.stars{color:#e59b00;letter-spacing:2px}.stat{font-weight:700;margin-bottom:12px}
form.box{background:var(--surf);border:2px solid var(--bd);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:5px 5px 0 var(--sh)}
input,textarea,select{width:100%;font:15px system-ui;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical;min-height:84px}
.pri{background:var(--green);color:var(--on-green);border-radius:10px;padding:11px 20px;font-size:15px;box-shadow:3px 3px 0 var(--sh)}
.pri:disabled{opacity:.6;cursor:default}
.msg{font-size:14px;min-height:20px}.msg.err{color:var(--err)}.msg.ok{color:var(--green)}
.more{margin-top:10px;background:var(--surf);color:var(--ink);border-radius:10px;padding:8px 16px}
.del{background:var(--err);color:#fff;border:2px solid var(--bd);border-radius:8px;padding:3px 9px;cursor:pointer;font:700 12px system-ui}
dialog{border:2px solid var(--bd);border-radius:18px;background:var(--bg);color:var(--ink);padding:22px;width:min(470px,calc(100vw - 24px));max-height:90vh;overflow-y:auto;box-shadow:6px 6px 0 var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--bd);font-size:15px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:2px solid var(--bd);background:var(--surf);color:var(--ink);cursor:pointer;font-weight:800}
/* admin */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--saf);color:var(--on-saf);border:2px solid var(--bd);border-radius:999px;padding:12px 20px;font:800 14px system-ui;cursor:pointer;box-shadow:4px 4px 0 var(--sh)}
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ebar input{max-width:200px;padding:7px 10px;background:var(--bg);color:var(--ink)}
.ebar button{border:2px solid var(--bg);background:transparent;color:var(--bg);border-radius:9px;padding:7px 14px;font:700 13px system-ui;cursor:pointer}
.ebar .save{background:var(--saf);color:#14231a;border-color:var(--saf)}
.ebar .st{margin-left:auto;font-size:13px}
.editing [contenteditable]{outline:2px dashed var(--saf);outline-offset:3px;cursor:text}
.acard{gap:8px;transform:none!important}.acard .em,.acard h3,.acard .row{transform:none}
.acard .f{display:grid;grid-template-columns:64px 1fr;gap:8px}
.acard label{font-size:13px;display:flex;gap:6px;align-items:center}.acard label input{width:auto}
.add3{display:grid;place-items:center;min-height:200px;border:2px dashed var(--bd);border-radius:16px;background:transparent;color:var(--ink);font:800 16px system-ui;cursor:pointer}
@media (max-width:820px){nav{display:none}.hero-grid{grid-template-columns:1fr}.stage{height:360px;transform:scale(.8)}.rv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.spit,.turn{animation:none}.r3{opacity:1;transform:none}.card,.spit{transition:none}}
</style>
</head>
<body>
<header><div class="wrap bar">
<a class="logo" href="#top" id="logo"></a>
<nav><a href="#menu">Меню</a><a href="#why">О нас</a><a href="#places">Адреса</a></nav>
<button class="cartbtn" id="cartbtn" type="button">Корзина · 0,00 BYN</button>
</div></header>
<main id="top">
<div class="wrap hero"><div class="hero-grid">
<div><span class="tag" data-k="tag"></span><h1 data-k="heroTitle"></h1><p class="lead" data-k="lead"></p><a class="btn" href="#menu">Выбрать донер</a></div>
<div class="stage" id="stage" aria-hidden="true"><div class="floor"></div><div class="spit" id="spit"><div class="turn" id="turn"><div class="rod"></div><div class="rod b"></div></div></div></div>
</div></div>
<section id="menu"><div class="wrap">
<h2>Меню</h2>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="rv" id="rv" hidden>
<form class="box" id="rvform" autocomplete="off">
<strong>Оставить отзыв</strong>
<input id="rvname" placeholder="Ваше имя" maxlength="40" required>
<select id="rvrate" aria-label="Оценка"><option value="5">★★★★★ — отлично</option><option value="4">★★★★ — хорошо</option><option value="3">★★★ — нормально</option><option value="2">★★ — плохо</option><option value="1">★ — ужасно</option></select>
<textarea id="rvtext" placeholder="Что понравилось, что улучшить?" maxlength="600" required></textarea>
<button class="pri" type="submit">Отправить</button>
<div class="msg" id="rvmsg" role="status"></div>
</form>
<div><div class="stat" id="rvstat"></div><div class="rvlist" id="rvlist"></div><button class="more" id="rvmore" type="button" hidden>Показать ещё</button></div>
</div>
</div></section>
<section id="why"><div class="wrap"><h2>Почему Ander</h2><div class="why" id="whylist"></div></div></section>
<section id="places"><div class="wrap"><h2>Где нас найти</h2><ul class="addr" id="placelist"></ul><div id="placeadd"></div></div></section>
</main>
<footer><div class="wrap"><div><strong id="fbrand"></strong><br><span data-k="footer"></span></div><button class="adm" id="admlink" type="button">Вход для администратора</button></div></footer>
<datalist id="cats"></datalist>

<button class="fab" id="fab" type="button" hidden>✎ Редактировать сайт</button>
<div class="ebar" id="ebar" hidden>
<input id="brandin" maxlength="40" aria-label="Название сайта" placeholder="Название сайта">
<button class="save" id="esave" type="button">Сохранить для всех</button>
<button id="ecancel" type="button">Отмена</button>
<button id="elogout" type="button">Выйти</button>
<span class="st" id="est"></span>
</div>

<dialog id="dlg">
<h3 style="margin:0 0 8px">Ваш заказ</h3>
<div id="lines"></div>
<div class="line"><strong>Итого</strong><strong id="total"></strong></div>
<form id="ofm" style="display:grid;gap:10px;margin-top:14px" autocomplete="on">
<input id="oname" placeholder="Имя" maxlength="60" autocomplete="name" required>
<input id="ophone" type="tel" placeholder="Телефон, например +375 29 123-45-67" maxlength="25" autocomplete="tel" required>
<input id="oaddr" placeholder="Адрес доставки" maxlength="200" autocomplete="street-address" required>
<textarea id="ocomm" placeholder="Комментарий (необязательно)" maxlength="300"></textarea>
<div class="msg" id="omsg" role="status"></div>
<div style="display:flex;gap:10px"><button class="pri" id="osend" type="submit">Заказать</button><button class="more" style="margin:0" type="button" id="oclose">Закрыть</button></div>
</form>
</dialog>
<dialog id="ldlg">
<h3 style="margin:0 0 10px">Вход администратора</h3>
<form id="lfm" style="display:grid;gap:10px"><input id="lpass" type="password" placeholder="Пароль" autocomplete="current-password" required>
<div class="msg" id="lmsg" role="status"></div>
<div style="display:flex;gap:10px"><button class="pri" type="submit">Войти</button><button class="more" style="margin:0" type="button" id="lclose">Отмена</button></div></form>
</dialog>

<script src="config.js"></script>
<script>
const API=String(window.ANDER_API||'').replace(/\/$/,'');
let token='';try{token=sessionStorage.getItem('ad_tok')||''}catch{}
const setToken=t=>{token=t||'';try{t?sessionStorage.setItem('ad_tok',t):sessionStorage.removeItem('ad_tok')}catch{}};
const $=id=>document.getElementById(id);
const money=k=>(k/100).toFixed(2).replace('.',',');
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let site=null,admin=false,editing=false,cart=new Map(),sel='Все',rvOffset=0,rvLoaded=false,dirtyFlag=false;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

async function api(path,opts){
  const o={...opts,headers:{...(opts&&opts.headers),...(token?{authorization:'Bearer '+token}:{})}};
  const r=await fetch(API+path,o);const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Ошибка '+r.status);return j;
}
const send=(m,p,b)=>api(p,{method:m,headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});

/* ---------- 3D döner ---------- */
(function(){
  const t=$('turn'),N=110;
  for(let i=0;i<N;i++){const k=i/(N-1),w=Math.round(2*(34+82*Math.pow(k,.85)));const e=document.createElement('i');
    e.style.cssText='--w:'+w+'px;--y:'+(340-i*3)+'px;--a:'+((i*11)%360)+'deg';t.append(e)}
  if(!reduce)addEventListener('pointermove',e=>{const s=$('spit');s.style.setProperty('--ry',((e.clientX/innerWidth-.5)*40)+'deg');s.style.setProperty('--rx',((e.clientY/innerHeight-.5)*-16)+'deg')},{passive:true});
})();
/* tilt */
function tiltHandler(e){
  if(reduce||editing)return;const c=e.target.closest('[data-tilt]');if(!c||c.classList.contains('acard'))return;
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  c.style.transform='perspective(800px) rotateX('+((.5-y)*14)+'deg) rotateY('+((x-.5)*16)+'deg)';
}
['grid','whylist'].forEach(id=>{const n=$(id);n.addEventListener('pointermove',tiltHandler);n.addEventListener('pointerout',e=>{const c=e.target.closest('[data-tilt]');if(c&&!c.contains(e.relatedTarget))c.style.transform=''})});
/* reveal */
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1}):null;
const reveal=ns=>ns.forEach(n=>{n.classList.add('r3');io?io.observe(n):n.classList.add('in')});

/* ---------- editing helpers ---------- */
function setEd(e,on){if(!on){e.removeAttribute('contenteditable');return}try{e.contentEditable='plaintext-only'}catch{e.contentEditable='true'}}
function ed(tag,cls,text,list,i,f){const e=el(tag,cls,text);e.dataset.list=list;e.dataset.i=i;e.dataset.f=f;if(editing)setEd(e,true);return e}
function dirty(){dirtyFlag=true;$('est').textContent='Есть несохранённые изменения'}
document.addEventListener('input',e=>{
  const t=e.target;if(!editing||!t.dataset)return;
  if(t.dataset.k){site[t.dataset.k]=t.textContent;dirty()}
  else if(t.dataset.list){site[t.dataset.list][+t.dataset.i][t.dataset.f]=t.textContent;dirty()}
});

/* ---------- render ---------- */
function brandHtml(){const b=site.brand,i=b.lastIndexOf(' ');$('logo').replaceChildren();
  if(i<0){$('logo').append(b)}else{$('logo').append(b.slice(0,i));$('logo').append(el('b','',b.slice(i+1)))}
  $('fbrand').textContent=b;document.title=b}
function renderTexts(){
  document.querySelectorAll('[data-k]').forEach(n=>{n.textContent=site[n.dataset.k];setEd(n,editing)});
  brandHtml();
  const why=site.why.map((w,i)=>{const d=el('div','why-i');d.dataset.tilt='';d.append(ed('div','num',w.num,'why',i,'num'),ed('h3','',w.title,'why',i,'title'),ed('p','',w.text,'why',i,'text'));return d});
  $('whylist').replaceChildren(...why);reveal(why);
  $('placelist').replaceChildren(...site.places.map((p,i)=>{const li=el('li');li.append(ed('span','',p.name,'places',i,'name'));const r=el('span','h');r.append(ed('span','',p.hours,'places',i,'hours'));
    if(editing){const x=el('button','del','✕');x.type='button';x.onclick=()=>{site.places.splice(i,1);dirty();renderTexts()};r.append(' ',x)}li.append(r);return li}));
  $('placeadd').replaceChildren();
  if(editing){const b=el('button','more','＋ Добавить адрес');b.type='button';b.onclick=()=>{site.places.push({name:'Новый адрес',hours:'9:00–23:00'});dirty();renderTexts()};$('placeadd').append(b)}
}
function renderTabs(){
  const cats=['Все',...new Set(site.menu.map(m=>m.c)),'Отзывы'];
  if(!cats.includes(sel))sel='Все';
  $('tabs').replaceChildren(...cats.map(c=>{const b=el('button','tab',c);b.type='button';b.setAttribute('aria-pressed',c===sel);b.onclick=()=>{sel=c;renderMenu();if(c==='Отзывы'&&!rvLoaded)loadReviews(true)};return b}));
  $('cats').replaceChildren(...[...new Set(site.menu.map(m=>m.c))].map(c=>{const o=el('option');o.value=c;return o}));
}
function card(m){
  const d=el('div','card');d.dataset.tilt='';
  const b=el('button','round','+');b.type='button';b.setAttribute('aria-label','Добавить '+m.n);
  b.onclick=()=>{cart.set(m.id,(cart.get(m.id)||0)+1);updateBtn();const c=$('cartbtn');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')};
  const row=el('div','row');row.append(el('span','price',money(m.p)+' BYN'),b);
  d.append(el('div','em',m.e||'🍽️'),el('h3','',m.n),el('p','',m.d),row);return d;
}
function adminCard(m){
  const d=el('div','card acard');
  const inp=(v,ph,fn,cls)=>{const i=el('input',cls);i.value=v;i.placeholder=ph;i.oninput=()=>{fn(i.value);dirty()};return i};
  const top=el('div','f');top.append(inp(m.e,'🍽️',v=>m.e=v),inp(m.n,'Название',v=>m.n=v));
  const ds=el('textarea');ds.value=m.d;ds.placeholder='Описание';ds.oninput=()=>{m.d=ds.value;dirty()};
  const cat=inp(m.c,'Категория',v=>m.c=v);cat.setAttribute('list','cats');cat.onchange=()=>renderTabs();
  const pr=inp((m.p/100).toFixed(2),'Цена, BYN',v=>{const x=parseFloat(String(v).replace(',','.'));if(isFinite(x)&&x>=0&&x<=10000)m.p=Math.round(x*100)});pr.inputMode='decimal';
  const lab=el('label');const cb=el('input');cb.type='checkbox';cb.checked=m.on;cb.onchange=()=>{m.on=cb.checked;dirty()};lab.append(cb,'В продаже');
  const rm=el('button','del','Удалить');rm.type='button';rm.onclick=()=>{if(confirm('Удалить «'+m.n+'»?')){site.menu.splice(site.menu.indexOf(m),1);dirty();renderMenu()}};
  const row=el('div','row');row.append(lab,rm);d.append(top,ds,cat,pr,row);return d;
}
function renderMenu(){
  renderTabs();const isRv=sel==='Отзывы';$('grid').hidden=isRv;$('rv').hidden=!isRv;if(isRv)return;
  const nodes=site.menu.filter(m=>sel==='Все'||m.c===sel).map(m=>editing?adminCard(m):card(m));
  if(editing){const a=el('button','add3','＋ Добавить позицию');a.type='button';a.onclick=()=>{
    site.menu.push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),c:(sel==='Все'?'Новая категория':sel),e:'🍽️',n:'Новая позиция',d:'',p:500,on:true});dirty();renderMenu()};nodes.push(a)}
  $('grid').replaceChildren(...nodes);if(!editing)reveal(nodes);
}
function renderAll(){renderTexts();renderMenu();updateBtn();$('fab').hidden=!(admin&&!editing);$('ebar').hidden=!editing;document.body.classList.toggle('editing',editing);$('admlink').hidden=admin}
function applySite(s){
  admin=!!s.admin;site=s;delete site.admin;
  for(const id of [...cart.keys()])if(!site.menu.some(m=>m.id===id&&m.on))cart.delete(id);
  renderAll();
}

/* ---------- cart ---------- */
function cartTotals(){let n=0,s=0;for(const [id,q] of cart){const m=site.menu.find(x=>x.id===id);if(m){n+=q;s+=m.p*q}}return{n,s}}
function updateBtn(){const t=cartTotals();$('cartbtn').textContent='Корзина · '+money(t.s)+' BYN'+(t.n?' ('+t.n+')':'')}
function renderCart(){
  const box=$('lines');box.replaceChildren();
  for(const [id,q] of cart){
    const m=site.menu.find(x=>x.id===id);if(!m)continue;
    const l=el('div','line'),c=el('div','qty'),minus=el('button','','−'),plus=el('button','','+');minus.type=plus.type='button';
    minus.onclick=()=>{q>1?cart.set(id,q-1):cart.delete(id);renderCart();updateBtn()};
    plus.onclick=()=>{if(q<20){cart.set(id,q+1);renderCart();updateBtn()}};
    c.append(minus,el('span','',q),plus);l.append(el('span','',m.e+' '+m.n+' · '+money(m.p*q)),c);box.append(l);
  }
  if(!cart.size)box.append(el('div','line','Корзина пуста'));
  $('total').textContent=money(cartTotals().s)+' BYN';$('osend').disabled=!cart.size;
}
$('cartbtn').onclick=()=>{$('omsg').textContent='';renderCart();$('dlg').showModal()};
$('oclose').onclick=()=>$('dlg').close();
$('ofm').onsubmit=async ev=>{
  ev.preventDefault();const m=$('omsg'),btn=$('osend');btn.disabled=true;m.className='msg';m.textContent='Отправляем…';
  try{
    const j=await send('POST','/api/order',{name:$('oname').value,phone:$('ophone').value,address:$('oaddr').value,comment:$('ocomm').value,items:[...cart].map(([id,qty])=>({id,qty}))});
    cart.clear();updateBtn();renderCart();m.className='msg ok';m.textContent='Заказ №'+j.orderNo+' принят. Скоро свяжемся!';
  }catch(e){m.className='msg err';m.textContent=e.message;btn.disabled=!cart.size}
};

/* ---------- reviews ---------- */
function reviewNode(r){
  const d=el('div','rvi'),meta=el('div','meta');
  meta.append(el('span','',r.name),el('span','stars','★'.repeat(r.rating)+'☆'.repeat(5-r.rating)),el('span','',new Date(r.ts).toLocaleDateString('ru-RU')));
  const t=el('div','',r.text);t.style.whiteSpace='pre-wrap';d.append(meta,t);
  if(editing&&admin){const x=el('button','del','Удалить отзыв');x.type='button';x.style.marginTop='8px';
    x.onclick=async()=>{if(!confirm('Удалить отзыв?'))return;try{await send('DELETE','/api/reviews/'+r.id);loadReviews(true)}catch(e){alert(e.message)}};d.append(x)}
  return d;
}
async function loadReviews(reset){
  try{
    if(reset){rvOffset=0;$('rvlist').replaceChildren()}
    const j=await api('/api/reviews?limit=10&offset='+rvOffset);rvLoaded=true;
    $('rvstat').textContent=j.total?('Средняя оценка '+j.avg.toFixed(1)+' из 5 · отзывов: '+j.total):'Пока нет отзывов. Будьте первым!';
    j.items.forEach(r=>$('rvlist').append(reviewNode(r)));rvOffset+=j.items.length;$('rvmore').hidden=rvOffset>=j.total;
  }catch{$('rvstat').textContent='Не удалось загрузить отзывы'}
}
$('rvmore').onclick=()=>loadReviews(false);
$('rvform').onsubmit=async ev=>{
  ev.preventDefault();const m=$('rvmsg'),btn=ev.submitter;btn.disabled=true;m.className='msg';m.textContent='';
  try{await send('POST','/api/reviews',{name:$('rvname').value,rating:Number($('rvrate').value),text:$('rvtext').value});
    $('rvtext').value='';m.className='msg ok';m.textContent='Спасибо! Отзыв опубликован.';await loadReviews(true)}
  catch(e){m.className='msg err';m.textContent=e.message}
  btn.disabled=false;
};

/* ---------- admin ---------- */
$('admlink').onclick=()=>{$('lmsg').textContent='';$('lpass').value='';$('ldlg').showModal();$('lpass').focus()};
$('lclose').onclick=()=>$('ldlg').close();
$('lfm').onsubmit=async ev=>{
  ev.preventDefault();const m=$('lmsg');m.className='msg';m.textContent='';
  try{const lj=await send('POST','/api/admin/login',{password:$('lpass').value});setToken(lj.token);$('ldlg').close();applySite(await api('/api/site'))}
  catch(e){m.className='msg err';m.textContent=e.message}
};
function setEditing(on){editing=on;dirtyFlag=false;$('est').textContent='';if(on)$('brandin').value=site.brand;renderAll();if(sel==='Отзывы')loadReviews(true)}
$('fab').onclick=()=>setEditing(true);
$('brandin').oninput=()=>{site.brand=$('brandin').value;brandHtml();dirty()};
$('ecancel').onclick=async()=>{if(dirtyFlag&&!confirm('Отбросить несохранённые изменения?'))return;editing=false;applySite(await api('/api/site'));setEditing(false)};
$('elogout').onclick=async()=>{if(dirtyFlag&&!confirm('Выйти без сохранения?'))return;editing=false;try{await send('POST','/api/admin/logout')}catch{}setToken('');applySite(await api('/api/site'))};
$('esave').onclick=async()=>{
  const st=$('est');st.textContent='Сохраняем…';
  try{const j=await send('PUT','/api/site',site);site.rev=j.rev;dirtyFlag=false;st.textContent='Сохранено, все посетители увидят изменения'}
  catch(e){st.textContent='Ошибка: '+e.message}
};
addEventListener('beforeunload',e=>{if(editing&&dirtyFlag){e.preventDefault();e.returnValue=''}});

/* ---------- live updates for every visitor ---------- */
setInterval(async()=>{
  if(editing||!site||document.hidden)return;
  try{const j=await api('/api/site?rev='+site.rev);if(!j.unchanged)applySite(j)}catch{}
},20000);

api('/api/site').then(applySite).catch(()=>{$('grid').textContent='Не удалось загрузить сайт'});
</script>
</body>
</html>
